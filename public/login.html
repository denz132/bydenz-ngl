<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Login - BY DENZ</title>

<style>

body {
    margin: 0;

    min-height: 100vh;

    display: flex;

    align-items: center;

    justify-content: center;

    font-family: Arial;

    background:
        linear-gradient(
            135deg,
            #ff4f81,
            #ffb6ca
        );
}

.card {
    width: 90%;
    max-width: 400px;

    background: white;

    padding: 25px;

    border-radius: 20px;

    box-shadow:
        0 15px 40px #0002;
}

h1 {
    text-align: center;
    color: #ff4f81;
}

input,
button {
    width: 100%;

    padding: 14px;

    margin-top: 10px;

    box-sizing: border-box;

    border-radius: 12px;

    border: 1px solid #ddd;
}

button {
    background: #ff4f81;

    color: white;

    border: 0;

    font-weight: bold;
}

#result {
    text-align: center;

    margin-top: 15px;
}

</style>

</head>

<body>

<div class="card">

<h1>Login</h1>

<input
id="username"
placeholder="Username">

<input
id="password"
type="password"
placeholder="Password">

<button onclick="login()">
Login
</button>

<div id="result"></div>

</div>

<script>

async function login() {

    const username =
        document
        .getElementById("username")
        .value;

    const password =
        document
        .getElementById("password")
        .value;

    const result =
        document
        .getElementById("result");

    const response =
        await fetch(
            "/api/login",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body:
                    JSON.stringify({
                        username,
                        password
                    })
            }
        );

    const data =
        await response.json();

    if (data.success) {

        result.innerText =
            "✅ Login berhasil!";

        setTimeout(
            function() {
                location.href =
                    "/inbox.html";
            },
            700
        );

    } else {

        result.innerText =
            "❌ " + data.message;

    }

}

</script>

</body>

</html>
