<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BY DENZ NGL</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#fff1f6,#f5f1ff);
}

.container{
    width:100%;
    max-width:500px;
    margin:auto;
    padding:30px 18px;
}

.logo{
    text-align:center;
    color:#ff4f81;
    font-size:32px;
    font-weight:bold;
}

.card{
    background:white;
    margin-top:25px;
    padding:25px;
    border-radius:22px;
    box-shadow:0 12px 35px #00000012;
}

.avatar{
    width:90px;
    height:90px;
    margin:auto;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:40px;
    background:linear-gradient(135deg,#ff4f81,#ffabc5);
}

h2{
    text-align:center;
}

.info{
    text-align:center;
    color:#888;
}

textarea{
    width:100%;
    min-height:130px;
    resize:none;
    margin-top:20px;
    padding:15px;
    border:1px solid #ddd;
    border-radius:15px;
    font-family:inherit;
    font-size:16px;
}

button{
    width:100%;
    margin-top:12px;
    padding:15px;
    border:0;
    border-radius:15px;
    background:#ff4f81;
    color:white;
    font-weight:bold;
    font-size:16px;
}

#result{
    text-align:center;
    margin-top:15px;
}
</style>
</head>

<body>

<div class="container">

<div class="logo">NGL</div>

<div class="card">

<div class="avatar">💌</div>

<h2 id="username">
Loading...
</h2>

<div class="info">
Kirim pesan anonim ✨
</div>

<textarea
id="message"
maxlength="500"
placeholder="Tulis pesan kamu...">
</textarea>

<button onclick="send()">
💌 Kirim Pesan
</button>

<div id="result"></div>

</div>

</div>

<script>

const username =
    location.pathname
    .split("/")
    .pop()
    .toLowerCase();

async function loadProfile(){

    const response =
        await fetch(
            "/api/profile/" +
            encodeURIComponent(username)
        );

    const data =
        await response.json();

    if(!data.success){

        document.getElementById(
            "username"
        ).innerText =
            "User tidak ditemukan";

        return;
    }

    document.getElementById(
        "username"
    ).innerText =
        "@" + data.username;
}

async function send(){

    const message =
        document.getElementById(
            "message"
        ).value.trim();

    const result =
        document.getElementById(
            "result"
        );

    if(!message){

        result.innerText =
            "❌ Pesan masih kosong.";

        return;
    }

    result.innerText =
        "⏳ Mengirim...";

    try{

        const response =
            await fetch(
                "/api/message/" +
                encodeURIComponent(username),
                {
                    method:"POST",
                    headers:{
                        "Content-Type":
                            "application/json"
                    },
                    body:
                        JSON.stringify({
                            message
                        })
                }
            );

        const data =
            await response.json();

        if(data.success){

            result.innerText =
                "✅ Pesan terkirim!";

            document
                .getElementById("message")
                .value = "";

        }else{

            result.innerText =
                "❌ " + data.message;

        }

    }catch(error){

        result.innerText =
            "❌ Server error.";

    }
}

loadProfile();

</script>

</body>
</html>
